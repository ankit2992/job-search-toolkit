name: Daily Job Digest

# Runs the digest every morning and emails it. Free on GitHub-hosted runners.
# Setup (one time):
#   1. Repo Settings -> Secrets and variables -> Actions -> New repository secret
#        RESEND_API_KEY = your Resend key
#      (optional)  RESEND_FROM = you@yourdomain.com   (defaults to onboarding@resend.dev)
#   2. Make sure application/job-search-digest/service/users.json has your email + roles.

on:
  schedule:
    - cron: "0 13 * * *"      # 13:00 UTC daily (~8am ET in winter / 9am ET in summer)
  workflow_dispatch: {}        # also lets you run it on demand from the Actions tab

permissions:
  contents: write              # to commit the updated seen-state back

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/job-search-digest/service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}     # your real recipient email (kept out of the repo)
        run: python3 digest.py

      - name: Persist seen-state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add application/job-search-digest/service/state/seen.json
          git diff --staged --quiet || git commit -m "chore: update digest seen-state [skip ci]"
          git push
        working-directory: ${{ github.workspace }}
